                            const peak = points[p];
                            const capSize = amplitude * 0.16;
                            ctx.beginPath();
                            ctx.moveTo(peak.x, peak.y);
                            ctx.lineTo(peak.x - capSize, peak.y + capSize * 1.4);
                            ctx.lineTo(peak.x + capSize, peak.y + capSize * 1.4);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                }
            },

            eclipseGlow(ctx, width, height, colors) {
                const sorted = sortedByLuminance(colors);
                const spaceGrad = ctx.createLinearGradient(0, 0, 0, height);
                spaceGrad.addColorStop(0, sorted[0]);
                spaceGrad.addColorStop(1, sorted[1]);
                ctx.fillStyle = spaceGrad;
                ctx.fillRect(0, 0, width, height);

                paintStars(ctx, width, height, Math.floor(randomRange(60, 120)), height, hexToRgba(sorted[sorted.length - 1], 1));

                const cx = width * randomRange(0.35, 0.65);
                const cy = height * randomRange(0.35, 0.55);
                const r = width * randomRange(0.09, 0.14);
                const coronaColor = sorted[sorted.length - 1];
                const corona = ctx.createRadialGradient(cx, cy, r * 0.92, cx, cy, r * 2.4);
                corona.addColorStop(0, hexToRgba(coronaColor, 0.95));
                corona.addColorStop(0.35, hexToRgba(coronaColor, 0.35));
                corona.addColorStop(1, hexToRgba(coronaColor, 0));
                ctx.beginPath();
                ctx.arc(cx, cy, r * 2.4, 0, Math.PI * 2);
                ctx.fillStyle = corona;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = sorted[0];
                ctx.fill();

                // Fins rayons de corona, puis une étoile filante une fois sur deux
                paintLightRays(ctx, cx, cy, r * 1.05, r * 3.2, coronaColor, Math.floor(randomRange(10, 16)));
                if (randomRange(0, 1) > 0.55) {
                    paintShootingStar(ctx, width, height, sorted[sorted.length - 1]);
                }
            },

            complexConstellation(ctx, width, height, colors) {
                const numNodes = Math.floor(randomRange(60, 120));
                const maxDist = width * 0.15;
                const nodes = [];
                for (let i = 0; i < numNodes; i++) {
                    nodes.push({
                        x: randomRange(0, width),
                        y: randomRange(0, height),
                        r: randomRange(width * 0.002, width * 0.008),
                        c: pickColor(colors, 1)
                    });
                }

                ctx.lineWidth = width * 0.001;
                for (let i = 0; i < numNodes; i++) {
                    for (let j = i + 1; j < numNodes; j++) {
                        const dx = nodes[i].x - nodes[j].x;
                        const dy = nodes[i].y - nodes[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < maxDist) {
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.strokeStyle = nodes[i].c;
                            ctx.globalAlpha = 1 - dist / maxDist;
                            ctx.stroke();
                        }
                    }
                    ctx.globalAlpha = 1.0;
                    ctx.beginPath();
                    ctx.arc(nodes[i].x, nodes[i].y, nodes[i].r, 0, Math.PI * 2);
                    ctx.fillStyle = nodes[i].c;
                    ctx.fill();
                }
            },

            complexBauhaus(ctx, width, height, colors) {
                const shapes = Math.floor(randomRange(10, 25));
                for (let i = 0; i < shapes; i++) {
                    const type = Math.floor(randomRange(0, 3));
                    const cx = randomRange(0, width);
                    const cy = randomRange(0, height);
                    const size = randomRange(width * 0.05, width * 0.3);
                    ctx.fillStyle = pickColor(colors, 1);
                    ctx.globalAlpha = randomRange(0.7, 0.9);

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(randomRange(0, Math.PI * 2));

                    ctx.beginPath();
                    if (type === 0) {
                        ctx.arc(0, 0, size, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (type === 1) {
                        ctx.rect(-size / 2, -size / 2, size, size * randomRange(0.5, 2));
                        ctx.fill();
                    } else {
                        ctx.arc(0, 0, size, 0, Math.PI);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                ctx.globalAlpha = 1.0;
            },

            planetOrbit(ctx, width, height, colors) {
                const sorted = sortedByLuminance(colors);
                const spaceGrad = ctx.createLinearGradient(0, 0, 0, height);
                spaceGrad.addColorStop(0, sorted[0]);
                spaceGrad.addColorStop(1, sorted[1]);
                ctx.fillStyle = spaceGrad;
                ctx.fillRect(0, 0, width, height);

                paintStars(ctx, width, height, Math.floor(randomRange(70, 140)), height, hexToRgba(sorted[sorted.length - 1], 1));

                // Nébuleuse discrète en fond
                const nebulaCount = Math.floor(randomRange(1, 3));
                for (let i = 0; i < nebulaCount; i++) {
                    const ncx = width * randomRange(0.1, 0.9);
                    const ncy = height * randomRange(0.1, 0.9);
                    const nebulaR = width * randomRange(0.12, 0.22);
                    const nebula = ctx.createRadialGradient(ncx, ncy, 0, ncx, ncy, nebulaR);
                    nebula.addColorStop(0, hexToRgba(sorted[3], 0.18));
                    nebula.addColorStop(1, hexToRgba(sorted[3], 0));
                    ctx.beginPath();
                    ctx.arc(ncx, ncy, nebulaR, 0, Math.PI * 2);
                    ctx.fillStyle = nebula;
                    ctx.fill();
                }
                if (randomRange(0, 1) > 0.5) {
                    paintShootingStar(ctx, width, height, sorted[sorted.length - 1]);
                }

                const cx = width * randomRange(0.35, 0.65);
                const cy = height * randomRange(0.4, 0.6);
                const planetR = width * randomRange(0.08, 0.13);

                const halo = ctx.createRadialGradient(cx, cy, planetR * 0.9, cx, cy, planetR * 2.2);
                halo.addColorStop(0, hexToRgba(sorted[3], 0.3));
                halo.addColorStop(1, hexToRgba(sorted[3], 0));
                ctx.beginPath();
                ctx.arc(cx, cy, planetR * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = halo;
                ctx.fill();

                const ringAngle = randomRange(-0.35, 0.35);
                const ringRx = planetR * randomRange(1.7, 2.1);
                const ringRy = planetR * randomRange(0.35, 0.55);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(ringAngle);
                ctx.strokeStyle = hexToRgba(sorted[3], 0.6);
                ctx.lineWidth = height * 0.004;
                ctx.beginPath();
                ctx.ellipse(0, 0, ringRx, ringRy, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                const planetGrad = ctx.createRadialGradient(cx - planetR * 0.3, cy - planetR * 0.3, planetR * 0.1, cx, cy, planetR);
                planetGrad.addColorStop(0, sorted[3]);
                planetGrad.addColorStop(1, sorted[2]);
                ctx.beginPath();
                ctx.arc(cx, cy, planetR, 0, Math.PI * 2);
                ctx.fillStyle = planetGrad;
                ctx.fill();

                const moonCount = Math.floor(randomRange(1, 3));
                for (let i = 0; i < moonCount; i++) {
                    const angle = randomRange(0, Math.PI * 2);
                    const ex = ringRx * Math.cos(angle);
                    const ey = ringRy * Math.sin(angle);
                    const mx = cx + ex * Math.cos(ringAngle) - ey * Math.sin(ringAngle);
                    const my = cy + ex * Math.sin(ringAngle) + ey * Math.cos(ringAngle);
                    ctx.beginPath();
                    ctx.arc(mx, my, planetR * randomRange(0.08, 0.15), 0, Math.PI * 2);
                    ctx.fillStyle = sorted[sorted.length - 1];
                    ctx.fill();
                }
            }
        };

        const STYLE_KEYS = Object.keys(styleRenderers);

        /* =========================================================
           FILTRE (contraste / luminosité) & GRAIN
           ========================================================= */
        function buildFilterString() {
            const parts = [];
            if (contrastValue !== 100) parts.push(`contrast(${contrastValue}%)`);
            if (brightnessValue !== 100) parts.push(`brightness(${brightnessValue}%)`);
            return parts.length ? parts.join(' ') : 'none';
        }

        function applyGrain(ctx, width, height) {
            // Taille de tuile relative à la largeur du canvas (128px de référence pour 3840px)
            // afin que le grain garde la même densité perçue en aperçu et à l'export.
            const tileSize = Math.max(48, Math.round(width * 0.0333));
            const off = document.createElement('canvas');
            off.width = tileSize;
            off.height = tileSize;
            const octx = off.getContext('2d');
            if (!octx) return;
            const imgData = octx.createImageData(tileSize, tileSize);
            for (let i = 0; i < imgData.data.length; i += 4) {
                const v = Math.floor(randomRange(0, 255));
                imgData.data[i] = v;
                imgData.data[i + 1] = v;
                imgData.data[i + 2] = v;
                imgData.data[i + 3] = 255;
            }
            octx.putImageData(imgData, 0, 0);
            const pattern = ctx.createPattern(off, 'repeat');
            if (!pattern) return;
            ctx.save();
            ctx.globalCompositeOperation = 'overlay';
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = pattern;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
        }

        /* =========================================================
           MOTEUR DE RENDU
           ========================================================= */
        function drawArtwork(ctx, width, height, styleName, paletteIndex, seed) {
            randomGenerator = mulberry32(seed);
            const colors = palettes[paletteIndex] || palettes[0];

            // save()/restore() encadrent tout le rendu : sans ça, un style qui
            // laisse un shadowBlur, un lineWidth ou un globalAlpha non réinitialisé
            // contaminait le style suivant lors d'un changement de motif.
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            ctx.filter = buildFilterString();
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = colors[0];
            ctx.fillRect(0, 0, width, height);

            const renderer = styleRenderers[styleName] || styleRenderers.layeredHills;
            try {
                renderer(ctx, width, height, colors);
                paintMotifFinish(ctx, width, height, styleName, colors);
            } catch (err) {
                console.error(`Erreur lors du rendu du style "${styleName}" :`, err);
                ctx.filter = 'none';
                ctx.fillStyle = colors[0];
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = colors[1] || '#999999';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `700 ${Math.round(width * 0.018)}px Inter, sans-serif`;
                ctx.fillText('Erreur de génération — réessayez', width / 2, height / 2);
            }

            if (grainEnabled) {
                ctx.filter = 'none';
                applyGrain(ctx, width, height);
            }

            ctx.restore();
        }

        function renderPreviews() {
            drawArtwork(desktopCtx, desktopCanvas.width, desktopCanvas.height, currentStyle, currentPaletteIndex, globalSeed);
            drawArtwork(mobileCtx, mobileCanvas.width, mobileCanvas.height, currentStyle, currentPaletteIndex, globalSeed);
        }

        // Rendu léger, débounced sur une frame : utilisé pour les sliders
        // (contraste/luminosité) où l'on veut un retour visuel fluide sans
        // afficher l'état "génération" à chaque tick de glissement.
        function scheduleRender() {
            if (renderScheduled) return;
            renderScheduled = true;
            requestAnimationFrame(() => {
                renderPreviews();
                renderScheduled = false;
            });
        }

        // Rendu "lourd" : affiche un état génération et laisse le navigateur
        // peindre cet état avant le calcul synchrone coûteux (double rAF).
        function renderPreviewsAsync() {
            const requestId = ++heavyRenderRequest;
            const panel = document.getElementById('controlsSection');
            const status = document.getElementById('statusLabel');
            panel.classList.add('generating');
            status.textContent = 'Génération…';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    if (requestId !== heavyRenderRequest) return;
                    renderPreviews();
                    panel.classList.remove('generating');
                    status.textContent = '';
                });
            });
        }

        /* =========================================================
           TOASTS
           ========================================================= */
        function showToast(message, variant) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast${variant ? ' toast-' + variant : ''}`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('visible'));
            setTimeout(() => {
                toast.classList.remove('visible');
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        /* =========================================================
           LIGHTBOX (aperçu plein écran)
           ========================================================= */
        function openLightbox(type) {
            if (exportInProgress) return;
            exportInProgress = true;
            const panel = document.getElementById('controlsSection');
            const status = document.getElementById('statusLabel');
            panel.classList.add('generating');
            status.textContent = 'Génération HD…';
            // Double rAF : laisse le navigateur peindre l'état "génération" avant
            // le calcul synchrone coûteux du rendu plein format.
            requestAnimationFrame(() => {
                requestAnimationFrame(async () => {
                    try {
                        const exportCanvas = createExportCanvas(type);
                        const blob = exportCanvas.toBlob
                            ? await new Promise((resolve, reject) => {
                                exportCanvas.toBlob((value) => value ? resolve(value) : reject(new Error('Encodage impossible.')), 'image/png');
                            })
                            : await (await fetch(exportCanvas.toDataURL('image/png'))).blob();
                        if (lightboxObjectUrl) URL.revokeObjectURL(lightboxObjectUrl);
                        lightboxObjectUrl = URL.createObjectURL(blob);
                        document.getElementById('lightboxImg').src = lightboxObjectUrl;
                        document.getElementById('lightbox').classList.add('open');
                    } catch (err) {
                        console.error("Impossible d'ouvrir l'aperçu agrandi :", err);
                        showToast("Impossible d'afficher l'aperçu agrandi.", 'error');
                    } finally {
                        panel.classList.remove('generating');
                        status.textContent = '';
                        exportInProgress = false;
                    }
                });
            });
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            document.getElementById('lightboxImg').removeAttribute('src');
            if (lightboxObjectUrl) {
                URL.revokeObjectURL(lightboxObjectUrl);
                lightboxObjectUrl = null;
            }
        }
        function initLightbox() {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

            const desktopMockup = document.getElementById('desktopMockup');
            const phoneMockup = document.getElementById('phoneMockup');
            desktopMockup.addEventListener('click', () => openLightbox('desktop'));
            phoneMockup.addEventListener('click', () => openLightbox('mobile'));
            desktopMockup.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); openLightbox('desktop'); }
            });
            phoneMockup.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); openLightbox('mobile'); }
            });
        }

        /* =========================================================
           STYLE / PALETTE : sélection, verrous, cycle clavier
           ========================================================= */
        function setStyleByKey(key) {

        /* =========================================================
           SEED
           ========================================================= */
        function syncSeedInput() {

        function initSeedInput() {
            const input = document.getElementById('seedInput');
            const commit = () => {
                const val = normalizeSeed(input.value, 0);
                input.value = val;
                if (val !== globalSeed) {
                    globalSeed = val;
                    renderPreviewsAsync();
                    saveLastState();
                }
            };
            input.addEventListener('change', commit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            });
        }

            globalSeed = Math.floor(Math.random() * 2147483647);
            syncSeedInput();
            renderPreviewsAsync();

        function surpriseMe() {
            if (!styleLocked) {
                currentStyle = STYLE_KEYS[Math.floor(Math.random() * STYLE_KEYS.length)];
            }
            if (!paletteLocked) {
                currentPaletteIndex = Math.floor(Math.random() * palettes.length);

        /* =========================================================
           RÉGLAGES AVANCÉS : aspect, format, sliders, grain
           ========================================================= */
        function applyAspectDimensions() {
            const preset = ASPECT_PRESETS[aspectPreset] || ASPECT_PRESETS['16:9'];
            const previewWidth = DESKTOP_PREVIEW_WIDTH;
            const previewHeight = Math.round(DESKTOP_PREVIEW_WIDTH * (preset.height / preset.width));
            if (desktopCanvas.width !== previewWidth || desktopCanvas.height !== previewHeight) {
                desktopCanvas.width = previewWidth;
                desktopCanvas.height = previewHeight;
            }
            document.getElementById('desktopMockup').style.aspectRatio = preset.cssRatio;
        }

        // Construit un canvas hors-écran à la résolution d'EXPORT complète (4K bureau /
        // 1080x2400 mobile) et y dessine l'état courant. N'est appelé qu'à la demande
        // (téléchargement, aperçu plein écran) — jamais pendant l'édition live, ce qui est
        // la clé de l'optimisation : l'utilisateur ajuste les réglages sur un aperçu léger,
        // et ne paie le coût du rendu haute résolution qu'au moment de récupérer l'image.
        function createExportCanvas(type) {
            let width, height;
            if (type === 'desktop') {
                const preset = ASPECT_PRESETS[aspectPreset] || ASPECT_PRESETS['16:9'];
                width = preset.width;
                height = preset.height;
            } else {
                width = MOBILE_EXPORT_DIMENSIONS.width;
                height = MOBILE_EXPORT_DIMENSIONS.height;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) {
                throw new Error('Contexte 2D indisponible pour la génération haute résolution.');
            }
            drawArtwork(ctx, width, height, currentStyle, currentPaletteIndex, globalSeed);
            return canvas;
        }

            document.querySelectorAll('.aspect-btn').forEach((btn) => {

        /* =========================================================
           SYNCHRONISATION GLOBALE DE L'UI <- ÉTAT
           Utilisée après restauration de session, application d'un
           favori, "Surprise" ou réinitialisation.
           ========================================================= */
        function syncAllControlsFromState() {
            document.querySelectorAll('.style-btn[data-style]').forEach((b) => {
                const active = b.dataset.style === currentStyle;
                b.classList.toggle('active', active);
                b.setAttribute('aria-pressed', String(active));

            document.querySelectorAll('.aspect-btn').forEach((b) => {

                b.classList.toggle('active', active);
                b.setAttribute('aria-pressed', String(active));

                b.classList.toggle('active', active);
                b.setAttribute('aria-pressed', String(active));

            document.getElementById('qualityRow').style.display = currentFormat === 'jpeg' ? 'flex' : 'none';

            document.getElementById('contrastSlider').value = contrastValue;
            document.getElementById('contrastValueLabel').textContent = `${contrastValue}%`;
            document.getElementById('brightnessSlider').value = brightnessValue;
            document.getElementById('brightnessValueLabel').textContent = `${brightnessValue}%`;
            document.getElementById('qualitySlider').value = Math.round(jpegQuality * 100);
            document.getElementById('qualityValueLabel').textContent = `${Math.round(jpegQuality * 100)}%`;
            document.getElementById('grainToggle').checked = grainEnabled;

            updateLockButton(document.getElementById('styleLockBtn'), styleLocked, 'le motif');
            updateLockButton(document.getElementById('paletteLockBtn'), paletteLocked, 'la palette');

        /* =========================================================
           TÉLÉCHARGEMENT
           ========================================================= */
        function downloadWallpaper(type) {
            if (exportInProgress) return;
            exportInProgress = true;
            const panel = document.getElementById('controlsSection');
            const status = document.getElementById('statusLabel');
            panel.classList.add('generating');
            status.textContent = 'Génération…';

            // Double rAF : laisse le navigateur peindre l'état "génération" avant
            // de calculer le rendu 4K/plein format, qui est désormais généré à la
            // demande (le canvas affiché ne tourne plus qu'en basse résolution).
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    const finish = () => {
                        panel.classList.remove('generating');
                        status.textContent = '';
                        exportInProgress = false;
                    };

                    let canvas;
                    try {
                        canvas = createExportCanvas(type);
                    } catch (err) {
                        console.error('Échec de la génération haute résolution :', err);
                        showToast("La génération de l'image a échoué.", 'error');
                        finish();
                        return;
                    }

                    const mime = currentFormat === 'jpeg' ? 'image/jpeg' : 'image/png';
                    const ext = currentFormat === 'jpeg' ? 'jpg' : 'png';
                    const filename = `genewall_${type}_${currentStyle}_${globalSeed}.${ext}`;
                    const quality = currentFormat === 'jpeg' ? jpegQuality : undefined;

                    const triggerDownload = (url, isObjectUrl) => {
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = url;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        if (isObjectUrl) setTimeout(() => URL.revokeObjectURL(url), 1000);
                    };

                    try {
                        if (canvas.toBlob) {
                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    console.error('toBlob a renvoyé un blob vide, repli sur toDataURL.');
                                    try {
                                        triggerDownload(canvas.toDataURL(mime, quality), false);
                                        showToast(`Téléchargement ${type === 'desktop' ? 'PC' : 'Mobile'} lancé…`, 'success');
                                    } catch (fallbackErr) {
                                        console.error('Échec du téléchargement (repli) :', fallbackErr);
                                        showToast('Le téléchargement a échoué. Réessayez ou changez de navigateur.', 'error');
                                    }
                                    finish();
                                    return;
                                }
                                triggerDownload(URL.createObjectURL(blob), true);
                                showToast(`Téléchargement ${type === 'desktop' ? 'PC' : 'Mobile'} lancé…`, 'success');
                                finish();
                            }, mime, quality);
                        } else {
                            triggerDownload(canvas.toDataURL(mime, quality), false);
                            showToast(`Téléchargement ${type === 'desktop' ? 'PC' : 'Mobile'} lancé…`, 'success');
                            finish();
                        }
                    } catch (err) {
                        console.error('Échec du téléchargement :', err);
                        showToast("Le téléchargement a échoué. L'image est peut-être trop volumineuse pour ce navigateur.", 'error');
                        finish();
                    }
                });
            });
        }

        /* =========================================================
           FAVORIS (persistants via window.storage, données personnelles)
           ========================================================= */
        function buildFavoriteRow(key, data) {
            const row = document.createElement('div');
            row.className = 'favorite-row';

            const swatch = document.createElement('div');
            swatch.className = 'favorite-swatch';
            const colors = palettes[data.paletteIndex] || palettes[0];
            swatch.style.background = `linear-gradient(135deg, ${colors[1]}, ${colors[3]})`;

            const label = document.createElement('div');
            label.className = 'favorite-label';
            const styleName = STYLE_LABELS[data.style] || data.style;
            const strong = document.createElement('strong');
            strong.textContent = styleName;
            const span = document.createElement('span');
            span.textContent = `seed ${data.seed}`;
            label.append(strong, span);

            const applyBtn = document.createElement('button');
            applyBtn.className = 'btn favorite-btn';
            applyBtn.type = 'button';
            applyBtn.textContent = 'Appliquer';
            applyBtn.title = `Appliquer ce favori (${styleName})`;
            applyBtn.addEventListener('click', () => applyFavorite(data));

            const delBtn = document.createElement('button');
            delBtn.className = 'btn favorite-btn favorite-delete';
            delBtn.type = 'button';
            delBtn.textContent = '✕';
            delBtn.title = 'Supprimer ce favori';
            delBtn.setAttribute('aria-label', 'Supprimer ce favori');
            delBtn.addEventListener('click', () => deleteFavorite(key));

            row.append(swatch, label, applyBtn, delBtn);
            return row;
        }

        async function loadFavorites() {
            const listEl = document.getElementById('favoritesList');
            try {
                const result = await persistentStorage.list('favorite:');
                const keys = Array.isArray(result && result.keys)
                    ? result.keys.filter((key) => typeof key === 'string' && key.startsWith('favorite:')).slice(0, MAX_FAVORITES_TO_READ)
                    : [];
                if (keys.length === 0) {
                    listEl.innerHTML = '<p class="favorites-empty">Aucun favori pour le moment.</p>';
                    return;
                }
                const items = [];
                for (const key of keys) {
                    try {
                        const entry = await persistentStorage.get(key);
                        const data = entry && normalizePersistedState(JSON.parse(entry.value));
                        if (data) items.push({ key, data });
                    } catch (e) {
                        // Entrée illisible : on l'ignore plutôt que de casser toute la liste.
                    }
                }
                items.sort((a, b) => (b.data.createdAt || 0) - (a.data.createdAt || 0));
                listEl.innerHTML = '';
                if (items.length === 0) {
                    listEl.innerHTML = '<p class="favorites-empty">Aucun favori pour le moment.</p>';
                    return;
                }
                items.forEach(({ key, data }) => listEl.appendChild(buildFavoriteRow(key, data)));
            } catch (err) {
                console.error('Erreur chargement favoris :', err);
                listEl.innerHTML = '<p class="favorites-empty">Favoris indisponibles pour le moment.</p>';
            }
        }

        async function saveFavorite() {
            const id = `favorite:${Date.now()}_${Math.floor(Math.random() * 1000)}`;
            const data = {
                style: currentStyle,
                paletteIndex: currentPaletteIndex,
                seed: globalSeed,
                aspectPreset,
                format: currentFormat,
                contrast: contrastValue,
                brightness: brightnessValue,
                grain: grainEnabled,
                quality: jpegQuality,
                createdAt: Date.now()
            };
            try {
                const result = await persistentStorage.set(id, JSON.stringify(data));
                if (!result) throw new Error('Réponse vide du stockage');
                showToast('Favori enregistré ✓', 'success');
                await loadFavorites();
            } catch (err) {
                console.error('Erreur sauvegarde favori :', err);
                showToast("Impossible d'enregistrer ce favori.", 'error');
            }
        }

        async function deleteFavorite(key) {
            try {
                await persistentStorage.delete(key);
                showToast('Favori supprimé', 'info');
                await loadFavorites();
            } catch (err) {
                console.error('Erreur suppression favori :', err);
                showToast('Impossible de supprimer ce favori.', 'error');
            }
        }

        function applyFavorite(data) {
            const state = normalizePersistedState(data);
            if (!state) return;
            currentStyle = state.style;
            currentPaletteIndex = state.paletteIndex;
            globalSeed = state.seed;
            aspectPreset = state.aspectPreset;
            currentFormat = state.format;
            jpegQuality = state.quality;
            contrastValue = state.contrast;
            brightnessValue = state.brightness;
            grainEnabled = state.grain;

            syncAllControlsFromState();
            renderPreviewsAsync();
            saveLastState();
            showToast('Favori appliqué', 'success');
        }

        /* =========================================================
           SESSION : reprise automatique via window.storage (personnel)
           ========================================================= */
        let saveStateTimer = null;
        function saveLastState() {
            clearTimeout(saveStateTimer);
            saveStateTimer = setTimeout(async () => {
                const data = {
                    style: currentStyle,
                    paletteIndex: currentPaletteIndex,
                    seed: globalSeed,
                    aspectPreset,
                    format: currentFormat,
                    contrast: contrastValue,
                    brightness: brightnessValue,
                    grain: grainEnabled,
                    quality: jpegQuality,
                    styleLocked,
                    paletteLocked
                };
                try {
                    await persistentStorage.set('last-state', JSON.stringify(data));
                } catch (err) {
                    console.warn('Impossible de sauvegarder la session :', err);
                }
            }, 400);
        }

        async function restoreLastState() {
            try {
                const entry = await persistentStorage.get('last-state');
                if (!entry) return;
                const data = normalizePersistedState(JSON.parse(entry.value));
                if (!data) return;
                currentStyle = data.style;
                currentPaletteIndex = data.paletteIndex;
                globalSeed = data.seed;
                aspectPreset = data.aspectPreset;
                currentFormat = data.format;
                jpegQuality = data.quality;
                contrastValue = data.contrast;
                brightnessValue = data.brightness;
                grainEnabled = data.grain;
                styleLocked = data.styleLocked;
                paletteLocked = data.paletteLocked;
            } catch (err) {
                // Pas d'état précédent, ou stockage indisponible : on démarre par défaut.
                console.info('Aucune session précédente restaurée.');
            }
        }

        function resetDefaults() {
            currentStyle = 'layeredHills';
            currentPaletteIndex = 0;
            globalSeed = Math.floor(Math.random() * 2147483647);
            aspectPreset = '16:9';
            currentFormat = 'png';
            jpegQuality = 0.92;
            contrastValue = 100;
            brightnessValue = 100;
            grainEnabled = false;
            styleLocked = false;
            paletteLocked = false;

            syncAllControlsFromState();
            renderPreviewsAsync();
            saveLastState();
            showToast('Réglages par défaut restaurés', 'info');
        }

        /* =========================================================
           BOUTONS D'ACTION & THÈME
           ========================================================= */
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
        }

        function initActionButtons() {
            document.getElementById('themeBtn').addEventListener('click', toggleTheme);
            document.getElementById('randomSeedBtn').addEventListener('click', generateNewSeed);
            document.getElementById('surpriseBtn').addEventListener('click', surpriseMe);
            document.getElementById('resetBtn').addEventListener('click', resetDefaults);
            document.getElementById('downloadDesktopBtn').addEventListener('click', () => downloadWallpaper('desktop'));
            document.getElementById('downloadMobileBtn').addEventListener('click', () => downloadWallpaper('mobile'));
            document.getElementById('saveFavoriteBtn').addEventListener('click', saveFavorite);
        }

        /* =========================================================
           RACCOURCIS CLAVIER
           ========================================================= */
        function initKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                const tag = document.activeElement && document.activeElement.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;

                const lightboxOpen = document.getElementById('lightbox').classList.contains('open');
                if (lightboxOpen) {
                    if (e.key === 'Escape') closeLightbox();
                    return;
                }

                switch (e.key) {
                    case ' ':
                        e.preventDefault();
                        generateNewSeed();
                        break;
                    case 'r': case 'R':
                        surpriseMe();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        cycleStyle(1);
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        cycleStyle(-1);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        cyclePalette(-1);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        cyclePalette(1);
                        break;
                    case 'd': case 'D':
                        downloadWallpaper('desktop');
                        break;
                    case 'm': case 'M':
                        downloadWallpaper('mobile');
                        break;
                    case 't': case 'T':
                        toggleTheme();
                        break;
                    case 'f': case 'F':
                        saveFavorite();
                        break;
                    default:
                        break;
                }
            });
        }

        /* =========================================================
           DÉMARRAGE
           ========================================================= */
        initPalettes();
        initStyleButtons();
        initLockButtons();
        initAspectButtons();
        initFormatButtons();
        initSliders();
        initGrainToggle();
        initSeedInput();
        initLightbox();
        initActionButtons();
        initKeyboardShortcuts();

        (async function start() {
            await restoreLastState();
            syncAllControlsFromState();
            renderPreviews();
            await loadFavorites();
        })();
    })();
    </script>
</body>
</html>
